<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="button.css">
    <title>[Beta] TRETERA デッキメーカー</title>
</head>
<body>
    <header>
        <div id="header-title">
            <h2>TRETRA TOOLS</h2>
            <h3>| デッキメーカー</h3>
        </div>
    </header>
    <main>
        <!-- ログインフォームの追加 -->
        <!-- <div id="login-form">
            <input type="email" id="email" placeholder="メールアドレス">
            <input type="password" id="password" placeholder="パスワード">
            <button id="login-button">ログイン</button>
            <button id="logout-button" style="display:none;">ログアウト</button>
        </div> -->
        <!-- ログインフォームのここまで -->
        <div>
            <!-- カード追加 -->
            <div id="add-card">
                <p>＋カードを追加</p>
                <div id="add-card-sett">
                    <div id="add-card-sett-search">
                        <label for="card-search">カードを絞り込む:</label>
                        <input type="text" id="card-search" placeholder="カード名を入力">
                        <br>
                        
                        <select id="card-select">
                            <!-- カードのオプションがJavaScriptで追加される -->
                            </select>
                    </div>
                    <div id="add-card-sett-search">
                        <button id="add-selected-card-button" class="blue-button">＋カードをデッキに追加</button>
                    </div>
                </div>
                <!-- 非表示中 -->
                <div id="preselected-cards-wrap" style="display: none;">
                    <label for="preselected-cards">事前に選択しているカード (カンマ区切り):</label>
                    <input type="text" id="preselected-cards" placeholder="例: 1,5,7">
                </div>
                <div id="selected-cards-container"></div>
                <!-- 一括解除ボタンの追加 -->
                <div id="clear-all-cards-wrap">
                    <button id="clear-all-selected-cards-button" class="red-button">全カードを解除</button>
                </div>
            </div>
            <div id="random-card">
                <!-- 発売時期選択UIの追加 -->
                <h4>ランダムカード抽出設定</h4>
                <p>指定カードが10枚以下のとき、足りない分をランダムに抽出して補完します
                <br>以下チェックボックスで抽出する範囲を設定
                </p>
                <div id="release-period-container">
                    <p>ランダムに抽出するカードの範囲を選択（複数選択OK）</p>
                    <!-- JavaScriptで選択肢を動的に挿入 -->
                </div>
            </div>
            <button id="change-images-button" class="blue-button">デッキ作成</button>
            <div id="display-columns-panel">
                <div id="display-columns-control">
                    <p>表示列数</p>
                    <button id="decrease-columns-button" class="blue-button small-control-button">－</button>
                    <span id="display-columns-value">3</span>
                    <button id="increase-columns-button" class="blue-button small-control-button">＋</button>
                </div>
            </div>
        </div>
        <div id="image-container"></div>
        
        <!-- デッキ一覧画像出力の追加　ここから -->
        <!-- モーダル構造 -->
        <div id="deckModal" class="modal">
            <div id="modal-background"></div>
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="popup-content"></div>
                <!-- <div id="modal-sett">
                    <div class="toggle" id="hight-quality-button"><input type="checkbox" name="check" id="hight-quality-check"/></div>
                    <p>高画質で書き出す</p>
                </div> -->
                <br><button id="saveButton" class="blue-button">画像を保存する</button>
            </div>

        </div>
        <canvas id="deckCanvas" style="display:none;"></canvas>
        
        <button id="export-deck-button" class="blue-button">デッキを画像として出力</button>
        <!-- デッキ一覧画像出力の追加　ここまで -->
    </main>
    <footer>
        <h3>TRETRA_TOOLS</h3>
        <a href="https://tretra.wixsite.com/tretra">TRETRA公式サイト</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
    <script>window.wanakana = wanakana;</script> <!-- wanakana をグローバルに登録 -->
    <!-- <script src="loadCards.js" type="module"></script>
    <script src="main.js" type="module"></script> -->
    <!-- <script src="src/ExportDeck.js" type="module"></script> -->
    
    <script src="dist/bundle.js" type="module"></script>
    <!-- <script src="src/main.js" type="module"></script>-->    <!-- 既存の main.js を読み込む -->
    <!-- <script src="src/app.js" type="module"></script> -->    <!-- app.js はコメントアウト -->
    <!-- <script src="button.js" type="module"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" ></script>
    <!-- <script type="module">
        import * as wanakana from 'https://cdn.jsdelivr.net/npm/wanakana@latest';
    </script> -->


</body>
</html>
